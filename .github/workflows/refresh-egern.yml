name: Refresh Egern resources
on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'
permissions:
  contents: write
concurrency:
  group: egern-resources
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3
      - run: python tools/refresh-egern-resources.py
      - name: Commit generated Egern resources
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Egern/Rules/
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh converted Egern remote resources'
            git pull --rebase
            git push
          fi
